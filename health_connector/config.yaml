name: Health Connector
slug: health_connector
version: "1.0.0"
description: Lets Claude read the Health Hub (food, Wahls cups, drinks, weekly review) and log a drink or meal from the cloud, behind your Home Assistant login (MCP)
url: https://github.com/markreesnz/health-hub
arch:
  - aarch64
  - amd64
init: false
boot: auto
startup: application
# No ports are published. Home Assistant reaches this add-on on the Supervisor's
# private network through the bundled health_mcp integration.
map:
  - type: homeassistant_config
    read_only: false
options:
  health_url: "http://44616b96-health-hub:8768"
schema:
  health_url: url
