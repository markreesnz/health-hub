name: Wine Watchlist
slug: wine
version: "1.0.0"
description: NZ wine watchlist — tracks 2 & 3 Merit releases on Real Review, notifies on new vintages
arch:
  - aarch64
  - amd64
init: false
boot: auto
startup: services
watchdog: "tcp://[HOST]:[PORT:8775]"
ports:
  "8775/tcp": 8775
ports_description:
  "8775/tcp": Wine Watchlist app
ingress: true
ingress_port: 8775
panel_icon: mdi:glass-wine
panel_title: Wine
map:
  - "share:rw"
homeassistant_api: true
