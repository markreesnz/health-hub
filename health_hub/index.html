    if(hasBw) BWMAP[s.index]={bw:false, fullText:s.detail, bwText:s.detail_bw, sumFull:s.summary, sumBw:s.summary_bw||s.summary};
    const bwBtn = hasBw ? `<button id="bwb-${s.index}" class="bwbtn" onclick="toggleBw(${s.index})">👕 Bodyweight</button>` : "";
    return `<div class="pl-row ${cls}" id="row-${s.index}"><div class="pl-num">Wk${s.week} · #${s.index+1}</div>
      <div class="pl-body"><div class="pl-focus">${tag} ${s.focus} ${link} ${bwBtn}</div>
      <div class="pl-sum" id="sum-${s.index}">${s.summary}</div>
      <details id="dt-${s.index}"><summary>Detail</summary><pre id="det-${s.index}">${s.detail}</pre></details></div></div>`;
  }).join("");
}

// ---- coaching (ask anything) ----
function mdCoach(t){
  return t.replace(/^###?\s*(.+?)\s*$/gm,"<h3>$1</h3>")
          .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
          .replace(/^\s*[-•]\s+(.*)$/gm,"<li>$1</li>")
          .replace(/(<li>[\s\S]*?<\/li>)/g,"<ul>$1</ul>");
}
async function askCoach(){
  const btn=document.getElementById("coachBtn"), out=document.getElementById("coach");
  const question=(document.getElementById("coach-ask")||{}).value||"";
  btn.disabled=true;btn.textContent="Thinking…";
  out.innerHTML=`<span class="skel">Reading your data…</span>`;
  try{
    const body={question,today:METRICS,trends:HIST,workout:WORKOUT,log:(STATE.log||[]).slice(-12),model:S.settings.model};
    const r=await fetch(`${hubBase()}/coach`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(async r=>{if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r.json();});
    out.innerHTML=`<div class="fsug">${mdCoach(r.answer||"No answer.")}</div>`;
  }catch(e){ out.innerHTML=`<span class="skel">Coaching unavailable: ${e.message}</span>`; }
  finally{ btn.disabled=false;btn.textContent="Ask the coach"; }
}

// ---- settings ----
function openSettings(){document.getElementById("hub").value=S.settings.hub;document.getElementById("model").value=S.settings.model;document.getElementById("apiKey").value=S.settings.apiKey;setDlg.showModal();loadOura();loadWithings();}
async function loadOura(){
  const box=document.getElementById("ouraBox"); if(!box)return;
  let st=null;
  try{ st=await fetch(`${hubBase()}/oura/status`).then(r=>r.json()); }catch(e){}
  if(!st){ box.innerHTML="Hub unreachable."; return; }
  if(!st.configured){
    box.innerHTML=`Paste your Oura app credentials (from cloud.ouraring.com/oauth/applications):<br>
      <input id="ouraCid" placeholder="client id" style="margin-top:6px">
      <input id="ouraSec" type="password" placeholder="client secret" style="margin-top:6px">
      <button class="btn primary" style="font-size:12px;margin-top:6px" onclick="ouraSaveCreds(this)">Save</button>
      <span id="ouraErr" style="color:var(--bad);font-size:11.5px"></span>`;
    return;
  }
  if(st.connected){
    box.innerHTML=`<span style="color:var(--good)">✓ Connected</span>${st.last_sync?` · last sync ${st.last_sync.slice(11,16)}`:""} <button class="btn" style="font-size:11px;padding:3px 10px;margin-left:8px" onclick="ouraSyncNow(this)">Sync now</button>`;
    return;
  }
  box.innerHTML=`${st.error==="reauthorize"?'<span style="color:var(--bad)">Connection lost — reauthorise:</span><br>':""}
    1. <a href="${st.authorize_url}" target="_blank" rel="noopener">Authorise with Oura</a> (the page it lands on will fail to load — that's fine)<br>
    2. Copy the failed page's full URL and paste it here:<br>
    <input id="ouraCode" placeholder="paste the redirected URL (contains ?code=…)" style="margin-top:6px">
    <button class="btn primary" style="font-size:12px;margin-top:6px" onclick="ouraConnect(this)">Connect</button>
    <span id="ouraErr" style="color:var(--bad);font-size:11.5px"></span>`;
}
async function ouraSaveCreds(btn){
  const cid=(document.getElementById("ouraCid").value||"").trim(), sec=(document.getElementById("ouraSec").value||"").trim();
  if(!cid||!sec)return;
  btn.disabled=true; btn.textContent="Saving…";
  try{
    const r=await fetch(`${hubBase()}/oura/creds`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({client_id:cid,client_secret:sec})}).then(r=>r.json());
    if(r.error)throw new Error(r.error);
    toast("Oura app saved");
  }catch(e){ const el=document.getElementById("ouraErr"); if(el)el.textContent=" "+e.message; }
  finally{ loadOura(); }
}
async function ouraConnect(btn){
  const code=(document.getElementById("ouraCode").value||"").trim(); if(!code)return;
  btn.disabled=true; btn.textContent="Connecting…";
  try{
    const r=await fetch(`${hubBase()}/oura/code`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code})}).then(r=>r.json());
    if(r.error)throw new Error(r.error);
    toast("Oura connected — backfilling 90 days");
  }catch(e){ const el=document.getElementById("ouraErr"); if(el)el.textContent=" "+e.message; }
  finally{ loadOura(); }
}
async function ouraSyncNow(btn){
  btn.disabled=true; btn.textContent="Syncing…";
  try{ await fetch(`${hubBase()}/oura/sync`,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}); toast("Oura synced"); loadAll(true); }
  catch(e){ toast("Sync failed"); }
  finally{ loadOura(); }
}
// ---- Withings: weight straight from the scale's cloud ----
async function loadWithings(){
  const box=document.getElementById("withingsBox"); if(!box)return;
  let st=null;
  try{ st=await fetch(`${hubBase()}/withings/status`).then(r=>r.json()); }catch(e){}
  if(!st){ box.innerHTML="Hub unreachable."; return; }
  const err=`<span id="wErr" style="color:var(--bad);font-size:11.5px"></span>`;
  if(!st.configured){
    box.innerHTML=`Create a free app at developer.withings.com (Public API), with a callback URL such as
      <code>https://localhost/withings</code>. Then paste its details:<br>
      <input id="wCid" placeholder="client id" style="margin-top:6px">
      <input id="wSec" type="password" placeholder="client secret" style="margin-top:6px">
      <input id="wRed" placeholder="callback URL you registered (https://…)" style="margin-top:6px">
      <button class="btn primary" style="font-size:12px;margin-top:6px" onclick="withingsSave(this)">Save</button>${err}`;
    return;
  }
  if(st.connected){
    box.innerHTML=`<span style="color:var(--good)">✓ Connected</span>${st.last_weight?` · ${st.last_weight.kg} kg on ${st.last_weight.date}`:""}${st.last_sync?` · synced ${st.last_sync.slice(11,16)}`:""}
      <button class="btn" style="font-size:11px;padding:3px 10px;margin-left:8px" onclick="withingsSync(this)">Sync now</button>`;
    return;
  }
  box.innerHTML=`${st.error==="reauthorize"?'<span style="color:var(--bad)">Connection lost — reauthorise:</span><br>':""}
    1. <a href="${st.authorize_url}" target="_blank" rel="noopener">Authorise with Withings</a> (the page it lands on may not load — that's fine)<br>
    2. Copy that page's full URL and paste it here:<br>
    <input id="wCode" placeholder="paste the redirected URL (contains ?code=…)" style="margin-top:6px">
    <button class="btn primary" style="font-size:12px;margin-top:6px" onclick="withingsConnect(this)">Connect</button>${err}`;
}
async function withingsCall(btn,path,body,busy,ok){
  btn.disabled=true; btn.textContent=busy;
  try{ const r=await fetch(`${hubBase()}${path}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json());
    if(r.error)throw new Error(r.error); toast(ok); }
  catch(e){ const el=document.getElementById("wErr"); if(el)el.textContent=" "+e.message; else toast(e.message); }
  finally{ loadWithings(); }
}
function withingsSave(btn){
  const v=id=>(document.getElementById(id).value||"").trim();
  withingsCall(btn,"/withings/creds",{client_id:v("wCid"),client_secret:v("wSec"),redirect_uri:v("wRed")},"Saving…","Withings app saved");
}
function withingsConnect(btn){ withingsCall(btn,"/withings/code",{code:(document.getElementById("wCode").value||"").trim()},"Connecting…","Withings connected — pulling a year of weigh-ins"); }
function withingsSync(btn){ withingsCall(btn,"/withings/sync",{days:30},"Syncing…","Withings synced").then(()=>loadAll(true)); }
function saveSettings(){S.settings.hub=document.getElementById("hub").value.trim()||S.settings.hub;S.settings.model=document.getElementById("model").value;S.settings.apiKey=document.getElementById("apiKey").value.trim();save();setDlg.close();toast("Saved");loadAll(true);}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000);}
</script>
</body>
