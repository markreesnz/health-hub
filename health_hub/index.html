<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health</title>
<style>
  :root{
    /* Calm palette: warm neutrals, ink for actions, and one attention colour (--attn) used
       only for what's slipping. --bad = --warn: no red text anywhere (Mark's call). */
    --bg:#FAF9F6; --bg2:#ffffff; --card:#ffffff; --card2:#F2F0EA; --line:#ECEAE4;
    --ink:#1D1D1F; --mut:#86868B; --dim:#B9B8B3;
    --accent:#1D1D1F; --attn:#D9622B; --good:#3E8E6A; --warn:#C08A2E; --bad:#C08A2E; --purple:#7a5af0;
    --shadow:0 1px 0 #ECEAE4;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);
    color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:baseline;gap:12px;
    padding:18px 22px;background:rgba(250,249,246,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:19px;font-weight:680;letter-spacing:-.01em}
  header .date{color:var(--mut);font-size:13px}
  header .sp{flex:1}
  .iconbtn{cursor:pointer;border:1px solid var(--line);background:var(--card2);color:var(--mut);
    border-radius:9px;padding:7px 11px;font:inherit;font-size:13px}
  .iconbtn:hover{border-color:var(--accent);color:var(--ink)}
  .wrap{max-width:1280px;margin:0 auto;padding:22px;display:flex;flex-direction:column;gap:22px}
  .section-h{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
    margin:2px 2px 10px;font-weight:600}

  /* dashboard top: today metrics beside today's workout */
  .dash-top{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
  @media (max-width:820px){.dash-top{grid-template-columns:1fr}}
  .dash-2col{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  @media (max-width:820px){.dash-2col{grid-template-columns:1fr}}
  .hm-tabs{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
  .hm-tab{border:none;background:transparent;color:var(--mut);font:inherit;font-size:13px;font-weight:600;
    padding:6px 16px;border-radius:8px;cursor:pointer}
  .hm-tab.on{background:var(--bg2);box-shadow:var(--shadow);color:var(--ink)}
  .hm-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .hm-num{font-size:34px;font-weight:720;letter-spacing:-.02em;line-height:1}
  .hm-num small{font-size:14px;color:var(--dim);font-weight:600;margin-left:1px}
  .hm-lab{font-size:13px;color:var(--mut);font-weight:600}
  .headscore{display:inline-flex;align-items:baseline;gap:4px}
  .headscore b{font-size:20px;font-weight:720;letter-spacing:-.02em;line-height:1}
  .headscore span{font-size:12px;color:var(--mut)}
  /* score-first hero (legacy, unused) */
  .score-hero{display:flex;align-items:center;gap:22px;background:var(--card);border:1px solid var(--line);
    box-shadow:var(--shadow);border-radius:18px;padding:18px 22px}
  .sh-score{display:flex;flex-direction:column;gap:3px;flex:none}
  .sh-num{font-size:48px;font-weight:720;line-height:.95;letter-spacing:-.02em}
  .sh-num small{font-size:18px;color:var(--dim);font-weight:600;margin-left:1px;letter-spacing:0}
  .sh-lab{font-size:13px;color:var(--mut);font-weight:600}
  .sh-spark{flex:1;min-width:0;display:flex;flex-direction:column}
  .sh-spark .chart{width:100%;height:54px;display:block}
  .sh-sub{font-size:10px;color:var(--dim);text-align:right;margin-top:3px;letter-spacing:.03em}
  .scores2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
  @media (max-width:380px){.scores2{gap:7px}}
  .sc2{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
    border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
  .sc2-num{font-size:23px;font-weight:720;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  .sc2-lab{font-size:13px;color:var(--ink);font-weight:680;display:flex;flex-direction:column;line-height:1.35}
  .sc2-lab small{font-size:11px;color:var(--dim);font-weight:500}
  .rt-dev{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;margin-left:6px}
  .rt-dev.good{color:var(--good)} .rt-dev.bad{color:var(--warn)} .rt-dev.flat{color:var(--dim)}
  .mbase{font-size:9px;color:var(--dim);font-weight:500;margin-top:3px}
  .mbase.strain{color:var(--warn)}
  .sc2-tap{cursor:pointer;transition:border-color .12s,transform .06s}
  .sc2-tap:hover{border-color:var(--accent)}
  .sc2-tap:active{transform:scale(.985)}
  .tbanner{display:flex;align-items:center;gap:9px;cursor:pointer;border-radius:13px;padding:9px 12px;margin-bottom:10px;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card))}
  .tbanner.tone-good{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--card))}
  .tbanner.tone-bad{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card))}
  .tb-ico{font-size:15px}
  .tb-txt{flex:1;font-size:12.5px;color:var(--ink);min-width:0}
  .tb-txt b{font-weight:720}
  .tb-x{border:none;background:transparent;color:var(--mut);cursor:pointer;font-size:13px;padding:2px 4px;line-height:1}
  .tb-x:hover{color:var(--ink)}
  .newtag{display:inline-block;margin-left:6px;font-size:9px;font-weight:800;letter-spacing:.05em;color:#fff;background:var(--accent);border-radius:5px;padding:1px 5px;vertical-align:middle}
  .chg-new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .chg{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .chg-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
  .chg-lab{font-weight:680;font-size:13px;color:var(--ink)}
  .chg-stat{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
  .chg-stat small{font-weight:600;color:var(--dim);font-size:11px}
  .chg-cap{font-size:10.5px;color:var(--dim);margin-top:3px}
  .mstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:0}
  .mcell{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
    border-radius:13px;padding:11px 13px;display:flex;flex-direction:column;gap:3px}
  .mcell.empty{opacity:.55}
  .mcell.goal-met{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--card))}
  .mcell.goal-met .mv{color:var(--good)}
  .gtag{font-size:10px;font-weight:700;color:var(--good);text-transform:none;letter-spacing:0}
  /* evening check-in */
  .ci-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 0;border-bottom:1px solid var(--line)}
  .ci-lab{font-size:14px;color:var(--ink);font-weight:500}
  .ci-auto{font-size:15px;font-weight:600;color:var(--mut)}
  .ci-auto small{font-size:11px;color:var(--dim);font-weight:500}
  .seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px}
  .seg-b{border:none;background:transparent;color:var(--mut);font:inherit;font-size:13px;font-weight:600;
    padding:6px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .seg-b.on{background:var(--bg2);box-shadow:var(--shadow);color:var(--ink)}
  .seg-b.on.good{color:var(--good)} .seg-b.on.bad{color:var(--bad)}
  .ci-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
  .ci-save{border:none;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:14px;
    padding:9px 18px;border-radius:10px;cursor:pointer}
  .ci-save:disabled{opacity:.6;cursor:default}
  /* food logger */
  /* food compliance grid — one row per target, one cell per day */
  .fcg{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center;margin-top:2px}
  .fcg-lab{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  .fcg-row{display:flex;gap:2px}
  .fcg-c{flex:1;height:13px;border-radius:3px;background:var(--card2)}
  .fcg-c.hit{background:var(--good)} .fcg-c.miss{background:color-mix(in srgb,var(--warn) 55%,var(--card2))}
  .fcg-key{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;background:var(--card2)}
  .fcg-key.hit{background:var(--good)} .fcg-key.miss{background:color-mix(in srgb,var(--warn) 55%,var(--card2))}
  .ftiles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .ftile{background:var(--card2);border-radius:12px;padding:11px 8px;text-align:center;cursor:pointer;border:1.5px solid transparent}
  .ftile.on{border-color:var(--accent)}
  .fsorthdr{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;
    font-weight:600;color:var(--mut);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .flink{border:none;background:none;color:var(--accent);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:0}
  .ftile .fv{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1}
  .ftile .fv small{font-size:10px;color:var(--mut);font-weight:500;margin-left:1px}
  .ftile .fl{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .fbar{height:4px;background:var(--card);border-radius:99px;overflow:hidden;margin-top:6px}
  .fbar i{display:block;height:100%;border-radius:99px}
  .flist{margin-top:14px}
  .fmeal{margin-bottom:12px}
  .fmh{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;color:var(--accent);padding-bottom:3px;
    border-bottom:1px solid var(--line);margin-bottom:2px}
  .fmh span{color:var(--dim);font-weight:600;text-transform:none;letter-spacing:0}
  .frow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
  .frow .fn{color:var(--ink);flex:1;min-width:0}
  .frow .fm{color:var(--mut);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
  .frow .fact{flex:none}
  .fsuggest{width:100%;margin-top:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);
    font:inherit;font-weight:600;font-size:13px;padding:10px;border-radius:11px;cursor:pointer}
  .fsuggest:disabled{opacity:.6;cursor:default}
  .fsug{margin-top:10px;background:var(--card2);border-radius:11px;padding:12px 14px;font-size:13.5px;line-height:1.5}
  .fsug h3{font-size:13px;margin:8px 0 2px} .fsug ul{margin:4px 0;padding-left:18px} .fsug li{margin:3px 0}
  .fsynced{text-align:right;font-size:10px;color:var(--dim);margin-top:10px}
  .fday{border-bottom:1px solid var(--line);padding:2px 0}
  .fday summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;list-style:none;
    padding:8px 0;font-size:13px;font-weight:600;color:var(--ink)}
  .fday summary::-webkit-details-marker{display:none}
  .fday summary span{color:var(--mut);font-weight:500;font-size:12px}
  .fday[open] summary{color:var(--accent)}
  .wpredict{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:color-mix(in srgb,var(--good) 10%,var(--card));
    border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin:12px 0 10px}
  .wpredict b{font-size:18px;color:var(--ink);font-weight:720}
  .wpredict span{font-size:11.5px;color:var(--mut)}
  .food-ask{width:100%;margin-top:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);
    font:inherit;font-size:13px;padding:9px 12px;border-radius:11px;box-sizing:border-box}
  /* Wahls tracker */
  .wahls{background:var(--card2);border-radius:12px;padding:12px 13px;margin-top:10px}
  .wahls .wh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;
    font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:10px}
  .wpill{font-size:10.5px;font-weight:700;letter-spacing:0;text-transform:none;padding:3px 10px;
    border-radius:99px;background:var(--card);color:var(--mut);white-space:nowrap}
  .wpill.ok{background:color-mix(in srgb,var(--good) 16%,var(--card));color:var(--good)}
  .wpill.bad{background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warn)}
  .wseg{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .wseg .wse{font-size:14px;width:18px;text-align:center}
  .wseg .wsl{font-size:11px;font-weight:600;color:var(--mut);width:46px}
  .wseg .wsc{flex:1;display:flex;gap:4px}
  .wseg .wsc i{flex:1;height:12px;border-radius:4px;display:block}
  .wseg .wsn{font-size:11.5px;font-weight:700;width:30px;text-align:right;font-variant-numeric:tabular-nums}
  .wtodo{font-size:11.5px;color:var(--warn);margin:8px 0 2px;line-height:1.45}
  .wweek{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:9px;padding-top:8px;
    border-top:1px solid var(--line);font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;color:var(--dim)}
  .wwk{font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--mut);
    display:inline-flex;align-items:center;gap:4px}
  .wwk small{color:var(--dim)}
  .wdot{width:9px;height:9px;border-radius:99px;background:var(--card);display:inline-block;border:1px solid var(--line)}
  .wdot.on{background:var(--good);border-color:var(--good)}
  .frow.off .fn.foff{color:var(--warn)}
  .frow.off .fn.foff small{font-size:10px;color:var(--warn);opacity:.75;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .fentry{margin-bottom:12px}
  .frow1{display:flex;gap:8px}
  .fusual{display:flex;gap:6px;overflow-x:auto;margin:10px 0 2px;padding-bottom:2px;scrollbar-width:none}
  .fusual button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12.5px;
    border-radius:99px;padding:6px 11px;cursor:pointer;white-space:nowrap}
  .fcam{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:12px;font-size:20px;
    padding:0 14px;cursor:pointer;display:flex;align-items:center}
  .fcam input{display:none}
  .ftime{flex:none;width:112px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font:inherit;
    font-size:14px;font-weight:600;border-radius:11px;padding:8px 6px}
  /* Today (direction B): one sentence, quiet habit pills, Zone 2 pace, today's actions */
  .t-wrap{max-width:560px}
  .t-date{font-size:13px;color:var(--mut);letter-spacing:.01em}
  .t-h1{font-family:"New York","Iowan Old Style",Georgia,serif;font-weight:400;font-size:30px;line-height:1.2;
    letter-spacing:-.01em;margin:14px 0 10px}
  .t-h1 em{font-style:normal;color:var(--attn)}
  .t-meta{font-size:14px;color:var(--mut);margin-bottom:26px;line-height:1.45}
  .t-lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
  .t-pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 8px}
  .t-pill{font:inherit;font-size:13.5px;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);
    display:flex;gap:8px;align-items:center;color:var(--ink);cursor:pointer}
  .t-pill i{width:8px;height:8px;border-radius:50%;display:block;border:1.5px solid var(--ink)}
  .t-pill i.done{background:var(--ink)} .t-pill i.missed,.t-pill i.unknown,.t-pill i.pending{background:transparent}
  .t-pill i.missed{border-color:var(--dim)}
  .t-pill.slip{border-color:var(--attn);color:var(--attn)} .t-pill.slip i{border-color:var(--attn)} .t-pill.slip i.done{background:var(--attn)}
  .t-pill.open{background:var(--card2)}
  .t-hd{font-size:12.5px;color:var(--mut);margin:4px 0 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .t-hd b{width:22px;text-align:center;font-weight:500}
  .t-hd span.d{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;
    border:1.5px solid var(--dim);color:var(--mut)}
  .t-hd span.d.done{background:var(--ink);border-color:var(--ink);color:#fff}
  .t-hd span.d.missed{border-color:var(--attn)} .t-hd span.d.future{border-style:dashed;border-color:var(--line)}
  .t-bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0 8px}
  .t-bar i{display:block;height:100%;background:var(--ink);border-radius:9px}
  .t-bar.slip i{background:var(--attn)}
  .t-row{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);gap:10px}
  .t-act{display:flex;gap:14px;align-items:center;padding:15px 0;border-top:1px solid var(--line);font-size:15.5px;cursor:pointer}
  .t-act:last-child{border-bottom:1px solid var(--line)}
  .t-act small{display:block;color:var(--mut);font-size:12.5px;margin-top:1px}
  .t-chk{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--dim);flex:none}
  .t-chk.done{background:var(--ink);border-color:var(--ink)}
  .t-act.done .t-txt{color:var(--mut);text-decoration:line-through}
  .t-q{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid var(--line);font-size:15px}
  .t-q:last-child{border-bottom:1px solid var(--line)}
  .t-q .b{display:flex;gap:6px}
  .t-q button,.t-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;
    border-radius:99px;padding:7px 14px;cursor:pointer}
  .t-q button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
  .t-sec{margin-top:28px}
  .t-link{border:none;background:none;color:var(--mut);font:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0}
  .t-set label{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);
    font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500;margin:0}
  .t-set input[type=checkbox]{accent-color:var(--ink);width:18px;height:18px}
  header #date{display:none}
  .t-set small{color:var(--mut);font-size:12px;display:block}
  .rv-grid{display:grid;grid-template-columns:96px repeat(7,1fr) 64px;row-gap:12px;align-items:center;font-size:13.5px;margin:12px 0 4px}
  .rv-grid .d{font-size:11px;color:var(--mut);text-align:center}
  .rv-dot{width:14px;height:14px;border-radius:50%;margin:auto;background:var(--ink);display:block}
  .rv-dot.missed{background:transparent;border:1.5px solid var(--attn)}
  .rv-dot.unknown,.rv-dot.none,.rv-dot.pending{background:transparent;border:1.5px solid var(--dim)}
  .rv-dot.future{background:transparent;border:1.5px dashed var(--line)}
  .rv-sum{font-size:12px;color:var(--mut);text-align:right}
  .rv-nights{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .rv-big{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:4px 0 2px}
  .rv-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
  .rv-row:last-child{border-bottom:1px solid var(--line)}
  .rv-row b{font-weight:600;text-align:right}.rv-row b small{color:var(--mut);font-weight:400}
  .rv-say{grid-column:1/-1;font-size:12.5px;color:var(--mut)}
  .rv-prop{padding:14px 0;border-top:1px solid var(--line)}
  .rv-prop:last-child{border-bottom:1px solid var(--line)}
  .rv-prop .tx{font-size:15px}.rv-prop small{display:block;color:var(--mut);font-size:12.5px;margin:2px 0 8px}
  .rv-prop .b{display:flex;gap:6px}
  .rv-prop.accepted .tx::before{content:"✓ ";color:var(--ink)}
  .rv-prop.skipped .tx{color:var(--dim);text-decoration:line-through}
  .in-big{margin:10px 0 6px}

  .wkbars{display:flex;align-items:flex-end;gap:7px;height:96px;margin:10px 0 2px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card2);
    border:1px solid var(--accent);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;font-size:13px}
  .toast.show{opacity:1}
  .skel{color:var(--dim);font-size:13px}
  /* Phones (iPhone 15 Plus ≈ 430pt). Tighten padding, make the tab bar + 12-month strip
     horizontally scrollable so nothing crams or overflows. */
  @media (max-width:480px){
    .wrap{padding:12px;gap:14px}
    .tabs{padding:0 10px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{white-space:nowrap;flex:0 0 auto;margin:0 4px;padding:11px 8px}
    .mc-strip{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .mc-strip::-webkit-scrollbar{display:none}
    .mc-phase{flex:0 0 auto;min-width:62px}
    .ftiles{grid-template-columns:repeat(2,1fr)}
    .pl-row{padding:10px 11px;gap:8px}
    .pl-num{min-width:42px}
    .pl-body{min-width:0}                /* let the flex column shrink instead of overflowing */
    .wlink{white-space:normal}           /* workout badge wraps instead of forcing width */
  }

  /* Dashboard trend reports — aleksagordic.com/health-style layout (raw + 7-day MA lines,
     dashed average marker, swatch legend). */
  .rg-tabs{display:flex;gap:18px;flex-wrap:wrap;margin:2px 0 14px;border-bottom:1px solid var(--line);padding-bottom:10px}
  .rg-tab{background:none;border:none;color:var(--dim);cursor:pointer;font:inherit;font-size:13px;
    padding:2px 0 8px;border-bottom:2px solid transparent}
  .rg-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .rg-tab:hover{color:var(--ink)}
  .rg-card{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  .rg-card:last-child{margin-bottom:0}
  .rg-card h3{color:var(--ink);font-size:14.5px;margin:0 0 4px;font-weight:700;letter-spacing:.01em}
  .rg-sub{font-size:10.5px;color:var(--dim);margin:0 0 10px}
  .rg-legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:11px;color:var(--mut);margin-bottom:8px}
  .rg-legend span{display:inline-flex;align-items:center;gap:6px}
  .rg-sw{width:15px;height:8px;border-radius:2px;display:inline-block;flex:0 0 auto}
  .rg-sw.dash{background:none;border-top:2px dashed;height:0;width:15px}
  .rg-chart{width:100%;height:auto;display:block}
  .rg-nochart{color:var(--dim);font-size:12px;padding:20px 0;text-align:center}
</style>
</head>
<body>

  <span class="sp"></span>

</header>
<div id="apiErrBanner" style="display:none;background:var(--card);
  border-bottom:1px solid var(--line);color:var(--mut);font-size:11.5px;padding:6px 22px"></div>

<nav class="tabs">
  <button class="tab active" data-tab="dash" onclick="showTab('dash')">Today</button>

<div class="wrap">
  <div class="panel active" id="panel-dash">
    <div class="t-wrap" id="today"><span class="skel">Loading…</span></div>

  </div>

    <div class="t-wrap" id="insightHead"><span class="skel">Loading…</span></div>
    <div><div class="section-h">Weight</div><div class="card" id="weight"><span class="skel">Loading…</span></div></div>
    <div>
      <div class="rangebar"><span class="section-h" style="margin:0">Sleep, heart &amp; activity</span><span class="ranges" id="ranges"></span></div>
      <div class="rg-tabs" id="rgTabs"></div>
      <div id="rgContent"><span class="skel">Loading…</span></div>

    <div class="card" id="planHead"><span class="skel">Loading plan…</span></div>
    <div class="card" id="blockCtl" style="display:none"></div>
    <div><div class="section-h">Sessions</div><div id="planSeq"></div></div>
  </div>
</div>

<dialog id="setDlg">
  <h2 style="margin:0 0 4px">Settings</h2>
  <label>Hub URL</label><input id="hub" placeholder="http://localhost:8768">
  <label>Model</label>
  <select id="model">
    <option value="claude-sonnet-4-6">claude-sonnet-4-6 (default)</option>
    <option value="claude-opus-4-8">claude-opus-4-8 (deeper)</option>
  </select>
  <label>Anthropic key <small style="text-transform:none;color:var(--dim)">(optional — hub uses its own)</small></label>
  <input id="apiKey" type="password" placeholder="leave blank — hub provides it">

  <div id="withingsBox" style="font-size:12.5px;color:var(--mut)">Checking…</div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">
    <button class="btn" onclick="setDlg.close()">Cancel</button>
    <button class="btn primary" onclick="saveSettings()">Save</button>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const LS="mark-health-v2";
const todayISO=new Date().toLocaleDateString("en-CA");
// The evening check-in window runs 6pm → 6pm: before 6pm it's still yesterday's (so a missed one
// stays available to catch up); at 6pm today's appears.
function checkinDate(){const d=new Date(todayISO+"T00:00"); if(new Date().getHours()<18)d.setDate(d.getDate()-1); return d.toLocaleDateString("en-CA");}
let S=load();
function dflt(){return {settings:{hub:"",model:"claude-sonnet-4-6",apiKey:""},summary:"",coach:{}};}
function load(){try{return Object.assign(dflt(),JSON.parse(localStorage.getItem(LS)||"{}"));}catch(e){return dflt();}}
function save(){localStorage.setItem(LS,JSON.stringify(S));}
// Same-origin base: empty hub = use the current page path (works on the LAN URL AND under HA Ingress).
// A non-empty hub setting overrides (e.g. point at a different host).
function hubBase(){return (S.settings.hub||location.pathname).replace(/\/+$/,"");}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

let METRICS={},HIST={},WORKOUT=null,STATE={},PROG=null,INS=null,CHECKIN={},FOOD={},FOODHIST={},WEIGHT={},ALC={},TRAIN={},PLAN={},USUAL=[],RANKED={},HOPEN=null,HSET=false,FSUM={},PHOTO=null,FOODAT=null,foodSort=null,FOODPENDING=[];
let uid=0;
let histDays=90;
const RANGES=[[7,"7d"],[30,"30d"],[90,"90d"],[365,"1y"],[3000,"All"]];

const META={
  hrv:{label:"HRV",unit:"ms",good:"up",dec:0,color:"#54d6a0"},
  resting_hr:{label:"Resting HR",unit:"bpm",good:"down",dec:0,color:"#f0b35e"},
  sleep:{label:"Sleep",unit:"h",good:"up",dec:1,color:"#9b8cff"},
  steps:{label:"Steps",unit:"",good:"up",dec:0,color:"#5fb8ff"},
  active_energy:{label:"Active energy",unit:"cal",good:"up",dec:0,color:"#f07a9a"},
  exercise_minutes:{label:"Exercise",unit:"min",good:"up",dec:0,color:"#54d6a0"},
  heart_rate:{label:"Heart rate",unit:"bpm",good:"flat",dec:0,color:"#f0b35e"},
  blood_oxygen:{label:"Blood O₂",unit:"%",good:"up",dec:0,color:"#5fb8ff"},
  respiratory_rate:{label:"Respiratory",unit:"br/m",good:"flat",dec:1,color:"#9b8cff"},
  weight:{label:"Weight",unit:"kg",good:"down",dec:1,color:"#f0b35e"},
  vo2_max:{label:"VO₂ max",unit:"",good:"up",dec:1,color:"#2fb4a6"},
  mindful_minutes:{label:"Meditation",unit:"min",good:"up",dec:0,color:"#9b8cff"},
  score:{label:"Readiness",unit:"/100",good:"up",dec:0,color:"#2fb4a6"},
  sleep_deep:{label:"Deep sleep",unit:"h",good:"up",dec:1,color:"#6d5fd6"},
  sleep_rem:{label:"REM sleep",unit:"h",good:"up",dec:1,color:"#b98cff"},
  sleep_core:{label:"Core sleep",unit:"h",good:"flat",dec:1,color:"#54d6a0"},
  sleep_awake:{label:"Awake",unit:"h",good:"down",dec:1,color:"#f07a9a"},
  temp_deviation:{label:"Temp deviation",unit:"°C",good:"flat",dec:2,color:"#f0665e"},
  readiness_score:{label:"Oura readiness",unit:"/100",good:"up",dec:0,color:"#2fb4a6"},
  sleep_score:{label:"Oura sleep",unit:"/100",good:"up",dec:0,color:"#9b8cff"},
  breathing_disturbance:{label:"Breathing disturb.",unit:"idx",good:"down",dec:1,color:"#f0665e"},
  daytime_stress:{label:"Daytime stress",unit:"h",good:"down",dec:1,color:"#f0b35e"},
  resilience:{label:"Resilience",unit:"/5",good:"up",dec:0,color:"#2fb4a6"},
};
const HERO_STRIP=["hrv","resting_hr","sleep","steps","active_energy","weight"];

document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
function showTab(t){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-"+t));
}
loadAll();

async function loadAll(force){
  const h=hubBase();
  // Each request fails on its own: a bad answer from one (an expired Home Assistant session,
  // a slow endpoint, a non-JSON error page) leaves that panel empty instead of the whole page.
  const fails=[];
  const get=(path,fallback)=>fetch(`${h}${path}`).then(async r=>{
      const json=(r.headers.get("content-type")||"").includes("json");
      if(!json) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }).catch(e=>{ fails.push(`${path.split("?")[0]}: ${e.message||e}`); return fallback; });
  const reqs=[
    get(`/metrics?date=${todayISO}`,{}), get(`/history?days=${histDays}`,{}), get(`/workout/current`,null),
    get(`/state`,{}), get(`/program`,null), get(`/insights`,null), get(`/status`,null),
    get(`/checkin?date=${checkinDate()}`,{}), get(`/food`,{}), get(`/food/history?days=30`,{}),
    get(`/weight`,{}), get(`/alcohol`,{}), get(`/training`,{}), get(`/today/plan`,{}), get(`/insights/ranked`,{}), get(`/food/usual`,{}),
  ];
  const [m,hist,w,st,prog,ins,stat,chk,food,fh,wt,alc,trn,tp,rk,us]=await Promise.all(reqs);
  if(fails.length===reqs.length){                       // nothing answered: the hub (or HA's session) is down
    const why=fails[0].replace(/^[^:]+: /,"");
    document.getElementById("hero").innerHTML=`<div class="card"><b>Can't reach the Health Hub</b>
      <div class="muted" style="font-size:12.5px;margin:6px 0 10px">${why==="HTTP 401"||why==="HTTP 403"
        ?"Home Assistant's sign-in for this page has expired."
        :why.startsWith("HTTP 5")?"The add-on isn't answering — it may be restarting after an update."
        :"No answer from the add-on ("+why+")."}</div>
      <button class="ci-save" onclick="location.reload()">Reload</button></div>`;
    return;
  }
  METRICS=m||{};HIST=hist||{};WORKOUT=w;STATE=st||{};PROG=prog;INS=ins;CHECKIN=chk||{};FOOD=food||{};FOODHIST=fh||{};WEIGHT=wt||{};ALC=alc||{};TRAIN=trn||{};PLAN=tp||{};RANKED=rk||{};USUAL=(us&&us.usual)||[];
  renderSynced(stat);
  if(st&&st.summary)S.summary=st.summary,save();
  // Show what didn't load: requests that failed outright, and endpoints that answered {error}.
  const apiErrs=fails.concat([["metrics",m],["history",hist],["insights",ins]]
    .filter(([,v])=>v&&typeof v==="object"&&v.error).map(([n,v])=>`${n}: ${v.error}`));
  const errEl=document.getElementById("apiErrBanner");
  if(errEl){
    if(apiErrs.length){ errEl.style.display="block";
      errEl.textContent="⚠ some data unavailable — "+apiErrs.map(s=>s.length>90?s.slice(0,90)+"…":s).join(" · "); }
    else{ errEl.style.display="none"; errEl.textContent=""; }
  }
  const up=document.getElementById("updatedPill");
  if(up)up.textContent="updated "+new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  // Each render is fault-isolated: one panel throwing (bad/unexpected data shape) must not
  // block the rest from rendering — otherwise a single bug anywhere in this list silently
  // leaves every later panel stuck on its initial "Loading…" placeholder forever.
  [renderToday,renderRanges,renderHero,renderFood,renderFoodHist,renderWeight,
   renderHeatmap,renderTraining,renderInsightHead,renderReports].forEach(fn=>{
    try{ fn(); }catch(e){ console.error(`[render] ${fn.name} failed:`,e); }
  });
  // Oura piggy-backs on every page refresh (server skips if synced <10 min ago). When fresh
  // data actually landed, quietly re-pull metrics + history and re-render the affected views.
  fetch(`${h}/oura/sync`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({days:2,throttle_secs:600})})
    .then(r=>r.json()).then(async j=>{
      if(!j||j.skipped||j.error)return;
      const [m,hist]=await Promise.all([
        fetch(`${h}/metrics?date=${todayISO}`).then(r=>r.json()),
        fetch(`${h}/history?days=${histDays}`).then(r=>r.json()),
      ]);
      METRICS=m||METRICS;HIST=hist||HIST;
      renderHero();renderInsights();
    }).catch(()=>{});
}

// Auto-refresh: whenever the app is (re)opened / brought to the foreground, and on a light
// interval while it's visible. Uses the plain (non-force) reload — light JSON reads, no food sync.
// Skips while a field is focused so it never clobbers in-progress entry (weight log, check-in).
let _lastRefresh=Date.now();
function autoRefresh(minGap){
  if(document.visibilityState!=="visible") return;
  const tag=document.activeElement&&document.activeElement.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;   // don't interrupt typing
  if(document.querySelector("details.wklog[open]")) return;    // don't close weight log
  if(minGap&&Date.now()-_lastRefresh<minGap) return;            // de-dupe rapid open/focus events
  _lastRefresh=Date.now();
  loadAll();
}
document.addEventListener("visibilitychange",()=>autoRefresh(3000));
window.addEventListener("focus",()=>autoRefresh(3000));
window.addEventListener("pageshow",()=>autoRefresh(3000));
setInterval(()=>autoRefresh(0),60000);   // periodic while foregrounded

// ---- value helpers ----
function curVal(k){const m=METRICS[k];if(!m)return null;return k==="sleep"?m.asleep_hours:m.value;}
function seriesAvg(k,n){const a=(HIST[k]||[]).slice(0,-1).slice(-n).map(d=>d.v);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null;}
function fmt(v,d){if(v===null||v===undefined||isNaN(v))return "–";return Number(v).toLocaleString(undefined,{maximumFractionDigits:d});}

// ---- charts (dependency-free SVG) ----
function chart(data,{h=80,color="#5fb8ff",fill=true,band=null,trend=null}={}){
  data=(data||[]).filter(d=>typeof d.v==="number");
  if(data.length<1) return `<div class="nochart">no data yet</div>`;
  const W=300,H=h,pad=8,iw=W-pad*2,ih=H-pad*2,n=data.length;
  let mn=Math.min(...data.map(d=>d.v)),mx=Math.max(...data.map(d=>d.v));
  if(band&&band.sd){mn=Math.min(mn,band.mean-band.sd);mx=Math.max(mx,band.mean+band.sd);}
  if(trend){mn=Math.min(mn,trend.start,trend.end);mx=Math.max(mx,trend.start,trend.end);}
  if(mn===mx){mn-=1;mx+=1;}
  const X=i=>pad+(n===1?iw/2:iw*i/(n-1)), Y=v=>pad+ih*(1-(v-mn)/(mx-mn));
  const trendSvg = trend ? `<line x1="${pad}" y1="${Y(trend.start).toFixed(1)}" x2="${(pad+iw).toFixed(1)}" y2="${Y(trend.end).toFixed(1)}" stroke="${color}" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" vector-effect="non-scaling-stroke"/>` : "";
  const pts=data.map((d,i)=>`${X(i).toFixed(1)},${Y(d.v).toFixed(1)}`).join(" ");
  const last=data[data.length-1], id="g"+(uid++);
  const area=`${pad},${(pad+ih).toFixed(1)} ${pts} ${X(n-1).toFixed(1)},${(pad+ih).toFixed(1)}`;
  let bandSvg="";
  if(band&&band.sd){
    const yT=Y(band.mean+band.sd), yB=Y(band.mean-band.sd), yM=Y(band.mean);
    bandSvg=`<rect x="${pad}" y="${yT.toFixed(1)}" width="${iw}" height="${(yB-yT).toFixed(1)}" style="fill:var(--dim)" opacity="0.10"/>
      <line x1="${pad}" x2="${pad+iw}" y1="${yM.toFixed(1)}" y2="${yM.toFixed(1)}" style="stroke:var(--dim)" stroke-dasharray="3 3" opacity="0.45" vector-effect="non-scaling-stroke"/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${bandSvg}
    ${fill?`<polygon points="${area}" fill="url(#${id})"/>`:""}
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    ${trendSvg}
    <circle cx="${X(n-1).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="3.2" fill="${color}"/>
  </svg>`;
}

// ---- render ----
// hue floor at amber (38°) — a low score should nudge, not alarm; no red anywhere
function scoreCol(v){const t=Math.max(0,Math.min(1,(v-10)/88));return `hsl(${Math.round(38+102*t)},62%,${Math.round(50-8*t)}%)`;}
function deltaBadge(k,v){
  const me=META[k], avg=seriesAvg(k,7);
  if(avg===null||avg===0) return "";
  const pct=(v-avg)/Math.abs(avg)*100; const better=me.good==="up"?pct>0:me.good==="down"?pct<0:null;
  const cls=Math.abs(pct)<1?"flat":(better===null?"flat":(better?"up":"down"));
  const arrow=pct>0?"▲":pct<0?"▼":"·";
  return `<span class="delta ${cls}">${arrow} ${Math.abs(pct).toFixed(0)}%</span>`;
}
const GOALS={steps:8000, active_energy:1000};  // activity goals (green when hit); meditation is a plain metric
// Which Trends category charts each hero metric (weight has its own tab instead).
const METRIC_TREND={hrv:"Heart",resting_hr:"Heart",heart_rate:"Heart",vo2_max:"Heart",
                    sleep:"Sleep",steps:"Activity",active_energy:"Activity",exercise_minutes:"Activity",
                    blood_oxygen:"Oxygen",breathing_disturbance:"Oxygen",daytime_stress:"Stress"};
function showTrend(cat){
  showTab('dash');
  rgActiveCat=cat; renderReports();
  const el=document.getElementById("rgTabs");
  if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
}
function metricTap(k){
  if(k==="weight") return ` onclick="showTab('insights')" style="cursor:pointer" title="View weight trend"`;
  const cat=METRIC_TREND[k];
  return cat?` onclick="showTrend('${cat}')" style="cursor:pointer" title="View ${cat} trends"`:"";
}
function metricCell(k){
  const me=META[k];
  if(GOALS[k]!=null){                         // goal metric, not a trend
    const goal=GOALS[k], v=curVal(k)||0, met=v>=goal;
    const tgt=`/${fmt(goal,0)}${me.unit?" "+me.unit:""}`;
    return `<div class="mcell${met?' goal-met':''}"${metricTap(k)}><div class="mk">${me.label}${met?'<span class="gtag">✓ goal</span>':''}</div>
      <div class="mv">${fmt(v,me.dec)}<small>${tgt}</small></div></div>`;
  }
  const v=curVal(k);
  if(v===null) return `<div class="mcell empty"><div class="mk">${me.label}</div><div class="mv">–</div></div>`;
  // Recovery metrics (HRV, resting HR, respiratory) carry the readiness-trend signal:
  // today vs personal 14-day baseline, coloured by whether the move is good for you.
  const tr=trendRow(k);
  let badge=deltaBadge(k,v), base="";
  if(tr){
    const sign=tr.dev*tr.good;
    const cls=Math.abs(tr.dev)<0.05?"flat":(sign>0?"good":"bad");
    const arrow=tr.dev>0?"▲":tr.dev<0?"▼":"·";
    const devTxt=tr.dev>0?`+${tr.dev}`:`${tr.dev}`;
    badge=`<span class="rt-dev ${cls}">${arrow} ${devTxt}</span>`;
    const run=tr.strained&&tr.run>=2?` · ${tr.run}d`:"";
    base=`<div class="mbase${tr.strained?' strain':''}">vs your baseline ${tr.base14}${run}</div>`;
  }
  return `<div class="mcell"${metricTap(k)}><div class="mk">${me.label}${badge}</div>
    <div class="mv">${fmt(v,me.dec)}<small>${me.unit}</small></div>${base}</div>`;
}
function trendRow(k){
  const t=INS&&INS.readiness_trend;
  return (t&&t.rows&&t.rows.find(r=>r.k===k))||null;
}
function wahlsStatus(w){
  if(!w) return null;
  const cups=w.cups||{}, tgt=w.cup_targets||{greens:3,sulfur:3,color:3}, tags=w.tags||{};
  const doneN=[(cups.greens||0)>=(tgt.greens||3),(cups.sulfur||0)>=(tgt.sulfur||3),
               (cups.color||0)>=(tgt.color||3),!!tags.seaweed].filter(Boolean).length;
  return {doneN, total:4, off:w.off_plan||0};
}
function renderHero(){
  const el=document.getElementById("hero");

// Wahls day score from logged items: the 4 dailies (greens/sulfur/colour cups, seaweed)
// averaged with the share of items that are Wahls-aligned. Ferment is tracked, not scored.
function wahlsDayScore(items){
  if(!(items&&items.length)) return null;
  if(!items.some(i=>i.wahls_ok!==undefined||i.group||i.tags)) return null;  // pre-Wahls-era log
  const clean=items.filter(i=>i.wahls_ok!==false).length/items.length;
  const cups={greens:0,sulfur:0,color:0}, tags={seaweed:0};
  items.forEach(i=>{ if(i.group&&cups[i.group]!=null) cups[i.group]+=(+i.cups||0);
    (i.tags||[]).forEach(t=>{ if(tags[t]!=null) tags[t]++; }); });
  const done=[cups.greens>=3,cups.sulfur>=3,cups.color>=3,tags.seaweed>0].filter(Boolean).length;
  return Math.round(100*(done/4+clean)/2);
}
function renderFood(){
  const el=document.getElementById("food"); if(!el)return;
  const f=FOOD||{}, t=f.totals||{}, tg=f.targets||{}, items=f.items||[];
  // dir: 'up' reach target (protein), 'down' stay under (carbs), 'cal' near/under, 'neutral' (fat)
  const tile=(lab,key,u,dir)=>{
    const v=Math.round(t[key]||0), goal=tg[key];
    let col="var(--mut)";
    if(goal){
      if(dir==="up") col=v>=goal?"var(--good)":"var(--accent)";
      else if(dir==="down") col=v<=goal?"var(--good)":"var(--bad)";
      else col=v<=goal*1.05?"var(--good)":"var(--warn)";
    }
    const pct=goal?Math.min(100,Math.round(v/goal*100)):0;
    return `<div class="ftile${foodSort===key?' on':''}" onclick="setFoodSort('${key}')"><div class="fv" style="${goal?`color:${col}`:""}">${v}<small>${goal?`/${goal}`:""}${u}</small></div>
      <div class="fl">${lab}</div>${goal?`<div class="fbar"><i style="width:${pct}%;background:${col}"></i></div>`:""}</div>`;
  };
  const row=(i,hl)=>{
    const b=(k,txt)=>hl===k?`<b style="color:var(--ink)">${txt}</b>`:txt;
    const fm=`${b("cal",Math.round(i.cal||0)+" cal")} · ${b("protein",Math.round(i.protein||0)+"p")} ${b("carbs",Math.round(i.carbs||0)+"c")} ${b("fat",Math.round(i.fat||0)+"f")}`;
    const off=i.wahls_ok===false;
    const name=off?`<span class="fn foff" title="Not Wahls-aligned${i.why?": "+i.why:""}">⚠ ${i.name}${i.why?` <small>${i.why}</small>`:""}</span>`
                  :`<span class="fn">${i.name}</span>`;
    const acts=i.id?`<span class="fact"><button class="fabtn" title="Edit" onclick="editFood('${i.id}')">✎</button><button class="fabtn" title="Remove" onclick="removeFood('${i.id}')">✕</button></span>`:"";
    return `<div class="frow${off?' off':''}">${name}<span class="fm">${fm}</span>${acts}</div>`;
  };
  const LBL={cal:"Calories",protein:"Protein",carbs:"Carbs",fat:"Fat"};
  let list;
  if(!items.length){
    list=`<div class="muted" style="font-size:12px">Nothing logged today — add your first food above.</div>`;
  } else if(foodSort){                               // ranked by the tapped macro, highest first
    const sorted=[...items].sort((a,b)=>(b[foodSort]||0)-(a[foodSort]||0));
    list=`<div class="fsorthdr">Ranked by ${LBL[foodSort]} ↓ <button class="flink" onclick="setFoodSort(null)">back to meals</button></div>`+
      sorted.map(i=>row(i,foodSort)).join("");
  } else {
    const MEALS=[["breakfast","Breakfast"],["lunch","Lunch"],["dinner","Dinner"],["snack","Snacks"]];
    const byMeal={}; items.forEach(i=>{const m=(i.meal||"snack").toLowerCase();(byMeal[m]=byMeal[m]||[]).push(i);});
    const order=MEALS.filter(([k])=>byMeal[k]).concat(Object.keys(byMeal).filter(k=>!MEALS.some(m=>m[0]===k)).map(k=>[k,k[0].toUpperCase()+k.slice(1)]));
    list=order.map(([k,lab])=>{
      const its=byMeal[k], cals=its.reduce((s,i)=>s+(i.cal||0),0), prot=its.reduce((s,i)=>s+(i.protein||0),0);
      return `<div class="fmeal"><div class="fmh">${lab}<span>${Math.round(cals)} cal · ${Math.round(prot)}g P</span></div>${its.map(i=>row(i)).join("")}</div>`;
    }).join("");
  }
  const tgline=tg.cal?`<div class="muted" style="font-size:11px;margin-top:8px">Target ${tg.cal} cal · ${tg.protein}g protein / ${tg.carbs}g carbs / ${tg.fat}g fat — high-protein, lower-carb · Wahls Paleo</div>`:"";
  const pend=FOODPENDING.map(p=>`<div class="frow pend"><span class="fn">${p.text}</span><span class="fm">adding…</span></div>`).join("");
  const hr=new Date().getHours(), defMeal=hr<10?"breakfast":hr<14?"lunch":hr<17?"snack":"dinner";
  const prev=document.getElementById("food-new");
  const keep=prev?{v:prev.value,f:document.activeElement===prev}:null;
  const entry=`<div class="fentry">
      <div class="frow1"><input id="food-new" class="fnewinput" placeholder="What did you eat? Separate foods with commas"
        onkeydown="if(event.key==='Enter')addFood()">
        <label class="fcam" title="Log a meal from a photo (anything typed is sent as a note)">📷<input type="file" accept="image/*" onchange="pickFoodPhoto(this)"></label></div>
      <div class="fentry2">
        <select id="food-meal" class="fmealsel">${["breakfast","lunch","dinner","snack"].map(m=>`<option value="${m}"${m===defMeal?" selected":""}>${m[0].toUpperCase()+m.slice(1)}</option>`).join("")}</select>
        <input type="time" class="ftime" id="food-at" value="${foodAt()}" title="Time eaten" onchange="FOODAT=this.value||null">

    ${USUAL.length?`<div class="fusual">${USUAL.map((u,i)=>`<button onclick="addUsual(${i})" title="${u.count}× in the last 30 days">+ ${esc(u.item.name)}</button>`).join("")}</div>`:""}
    <div id="food-err"></div>${photoPanel()}`;
  el.innerHTML=`${foodHeader(f)}${entry}<div class="ftiles">${tile("Calories","cal","","cal")}${tile("Protein","protein","g","up")}${tile("Carbs","carbs","g","down")}${tile("Fat","fat","g","neutral")}</div>${tgline}
    ${wahlsTracker(f.wahls)}
    <div class="flist">${list}${pend}${drinksBlock()}</div>${mealDial(f)}
    <input id="food-ask" class="food-ask" placeholder="optional steer — e.g. quick, no fish, something sweet" onkeydown="if(event.key==='Enter')suggestMeals()">
    <button class="fsuggest" onclick="suggestMeals()">✨ Suggest meals for the rest of today</button>
    <div id="food-suggest"></div>`;
  if(keep){const ni=document.getElementById("food-new"); if(ni){ni.value=keep.v; if(keep.f)ni.focus();}}
  loadFoodSummary(f);
}
// ---- Oura-style day view: rating, a short written note, and the week on four levels ----
const RATE_COL={Nutritious:"var(--good)",Good:"#5bb98c",Fair:"var(--warn)",Limited:"var(--bad)"};
function foodHeader(f){
  const r=f.rating||{}, items=f.items||[];
  if(!items.length) return `<div class="fd-head"><div class="fd-rate" style="color:var(--dim)">No meals logged yet</div>${foodWeek(f.week)}</div>`;
  const sm=(FSUM.date===todayISO&&FSUM.n===items.length)?FSUM:null;
  return `<div class="fd-head"><div class="fd-rate" style="color:${RATE_COL[r.label]||"var(--mut)"}">${r.label}<span>${r.meals} meal${r.meals===1?"":"s"} logged</span></div>
    <div class="fd-h1">${sm&&sm.headline?sm.headline:"Today so far"}</div>
    <div class="fd-sum">${sm?(sm.summary||""):sm===null&&FSUM.loading?'<span class="muted">Writing your note…</span>':""}</div>${foodWeek(f.week)}</div>`;
}
function foodWeek(week){
  if(!week||!week.length) return "";
  const LV=["Nutritious","Good","Fair","Limited"], W=350, x=i=>22+i*46, y=l=>14+LV.indexOf(l)*26;
  const lines=LV.map(l=>`<line x1="0" x2="${W}" y1="${y(l)}" y2="${y(l)}" stroke="var(--line)"/><text x="${W}" y="${y(l)-4}" text-anchor="end" font-size="9" fill="var(--dim)">${l}</text>`).join("");
  const pts=week.filter(d=>d.label).map(d=>[x(week.indexOf(d)),y(d.label),d]);
  const path=pts.length>1?`<polyline fill="none" stroke="var(--dim)" stroke-width="1" stroke-dasharray="2 3" points="${pts.map(p=>p[0]+","+p[1]).join(" ")}"/>`:"";
  const dots=pts.map(([px,py,d])=>`<circle cx="${px}" cy="${py}" r="${d.date===todayISO?6:4.5}" fill="${RATE_COL[d.label]}"${d.date===todayISO?' stroke="var(--card)" stroke-width="2"':""}><title>${d.date}: ${d.label} (${d.score})</title></circle>`).join("");
  const days=week.map((d,i)=>`<text x="${x(i)}" y="120" text-anchor="middle" font-size="10" fill="${d.date===todayISO?"var(--ink)":"var(--dim)"}" font-weight="${d.date===todayISO?700:400}">${new Date(d.date+"T00:00").toLocaleDateString("en-NZ",{weekday:"short"})}</text>`).join("");
  return `<svg class="fd-week" viewBox="0 0 ${W} 126">${lines}${path}${dots}${days}</svg>`;
}
async function loadFoodSummary(f){
  const n=(f.items||[]).length;
  if(!n||FSUM.loading||(FSUM.date===todayISO&&FSUM.n===n))return;
  FSUM={loading:true};
  try{
    const r=await fetch(`${hubBase()}/food/summary`).then(r=>r.json());
    FSUM=r.error?{date:todayISO,n,headline:null,summary:null}:{date:todayISO,n,headline:r.headline,summary:r.summary};
  }catch(e){ FSUM={date:todayISO,n,headline:null,summary:null}; }
  renderFood();
}
// ---- Meal timing: a 24-hour dial with meals, last night's sleep and when the kitchen closes ----
function mealDial(f){
  const tm=f.timing||{}, at=(f.items||[]).map(i=>i.at).filter(Boolean);
  const hrs=t=>{const [h,m]=t.split(":").map(Number);return h+m/60;};
  const C=130, ang=h=>(h%24)/24*2*Math.PI, pt=(h,r)=>[C+r*Math.sin(ang(h)),C-r*Math.cos(ang(h))];
  const arc=(h1,h2,r)=>{const span=((h2-h1)%24+24)%24, [x1,y1]=pt(h1,r), [x2,y2]=pt(h1+span,r);
    return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${span>12?1:0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;};
  const bed=curVal("bedtime_hour"), wake=curVal("wake_hour");      // last night, hours from noon
  const sleep=bed!=null&&wake!=null?`<path d="${arc(bed+12,wake+12,92)}" fill="none" stroke="#5aa9e6" stroke-width="9" stroke-linecap="round"><title>Last night's sleep</title></path>`:"";
  const kc=tm.kitchen_closes&&tm.bed?`<path d="${arc(hrs(tm.kitchen_closes),hrs(tm.bed),110)}" fill="none" stroke="var(--good)" stroke-width="7" stroke-linecap="round" opacity=".8"><title>Kitchen closes ${tm.kitchen_closes}</title></path>`:"";
  const meals=at.map(t=>{const [x,y]=pt(hrs(t),110);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="#f2b84b" stroke="var(--card)" stroke-width="2"><title>Ate at ${t}</title></circle>`;}).join("");
  const ticks=Array.from({length:24},(_,h)=>{const [x,y]=pt(h,124);return h%6?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.4" fill="var(--dim)"/>`:`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--mut)">${h}</text>`;}).join("");
  const now=new Date(), [nx,ny]=pt(now.getHours()+now.getMinutes()/60,100);
  const svg=`<svg class="fd-dial" viewBox="0 0 260 260">
    <circle cx="${C}" cy="${C}" r="110" fill="none" stroke="var(--card2)" stroke-width="7"/>
    <circle cx="${C}" cy="${C}" r="92" fill="none" stroke="var(--card2)" stroke-width="9"/>${ticks}${sleep}${kc}${meals}
    <line x1="${C}" y1="${C}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="${C}" cy="${C}" r="3" fill="var(--dim)"/></svg>`;
  const row=(a,b)=>`<div class="fd-trow"><span class="muted">${a}</span><b>${b}</b></div>`;
  const rows=(tm.last?row("Last meal",`${tm.last}${tm.gap_h!=null?` · <span style="color:${tm.late?"var(--warn)":"var(--good)"}">${tm.gap_h} h before bed</span>`:""}`):"")
    +(tm.kitchen_closes?row("Kitchen closes",`${tm.kitchen_closes} onwards`):"")
    +(tm.eating_window_h?row("Eating window",`${tm.eating_window_h} h`):"");
  return `<div class="section-h" style="margin:18px 2px 4px">Meal timing</div>${svg}
    <div class="muted" style="font-size:11px;text-align:center;margin:2px 0 8px"><span style="color:#f2b84b">●</span> meals · <span style="color:#5aa9e6">●</span> last night's sleep · <span style="color:var(--good)">●</span> kitchen closed (3 h before your usual bed)</div>${rows}`;
}
async function foodMutate(path,body,btn){
  if(btn)btn.disabled=true;
  try{
    const r=await fetch(`${hubBase()}/food/${path}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json();
    if(j.error)throw new Error(j.error);
    FOOD=j; renderFood();
    fetch(`${hubBase()}/food/history?days=30`).then(r=>r.json()).then(fh=>{FOODHIST=fh||{};renderFoodHist();}).catch(()=>{});
    return true;
  }catch(e){
    const el=document.getElementById("food-err");
    if(el)el.innerHTML=`<div class="ferr">Couldn't save: ${e.message}</div>`;
    return false;
  }finally{ if(btn)btn.disabled=false; }
}
function addFood(){
  const inp=document.getElementById("food-new"), meal=document.getElementById("food-meal").value;
  const text=(inp.value||"").trim(); if(!text)return;
  inp.value="";
  const at=foodAt();
  const p={text,meal}; FOODPENDING.push(p); renderFood();
  const ni=document.getElementById("food-new"); if(ni)ni.focus();
  foodMutate("entry",{text,meal,at}).then(ok=>{
    FOODPENDING=FOODPENDING.filter(x=>x!==p);
    if(ok!==false){ FOODAT=null; renderFood(); }
    if(ok===false){const ni=document.getElementById("food-new"); if(ni&&!ni.value)ni.value=text;}
    renderFood();
  });
}
function removeFood(id){ foodMutate("remove",{id}); }
// One tap repeats a usual food into the selected meal at the time in the box.
function addUsual(i){
  const u=USUAL[i]; if(!u)return;
  foodMutate("items",{items:[u.item],meal:document.getElementById("food-meal").value,at:foodAt()}).then(ok=>{ if(ok){FOODAT=null;renderFood();refreshPlan();} });
}
// Time eaten: "now" unless changed in the time box (kept until the next add).
function foodAt(){ return FOODAT||new Date().toTimeString().slice(0,5); }
// ---- log a meal from a photo: shrink it, ask the hub what's on the plate, confirm, save ----
function pickFoodPhoto(inp){
  const file=inp.files&&inp.files[0]; inp.value=""; if(!file)return;
  const meal=document.getElementById("food-meal").value, note=(document.getElementById("food-new").value||"").trim();
  PHOTO={status:"busy"}; renderFood();
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=async()=>{
    const k=Math.min(1,1280/Math.max(img.width,img.height)), c=document.createElement("canvas");
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    try{
      const r=await fetch(`${hubBase()}/food/photo`,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({image:c.toDataURL("image/jpeg",0.82).split(",")[1],media_type:"image/jpeg",note})}).then(r=>r.json());
      if(r.error) throw new Error(r.error);
      if(!(r.items&&r.items.length)) throw new Error("couldn't see any food in that photo");
      PHOTO={status:"ready",items:r.items,meal,note};
    }catch(e){ PHOTO={status:"error",msg:e.message}; }
    renderFood();
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); PHOTO={status:"error",msg:"couldn't open that image"}; renderFood(); };
  img.src=url;
}
function photoPanel(){
  if(!PHOTO) return "";
  if(PHOTO.status==="busy") return `<div class="fphoto muted">📷 Reading your photo…</div>`;
  if(PHOTO.status==="error") return `<div class="fphoto"><div class="ferr" style="margin:0">Photo: ${PHOTO.msg}</div>
    <button class="flink" onclick="PHOTO=null;renderFood()">dismiss</button></div>`;
  const it=PHOTO.items, sum=k=>Math.round(it.reduce((a,i)=>a+(+i[k]||0),0));
  const GRP={greens:"greens",sulfur:"sulfur",color:"colour"};
  const rows=it.map((i,ix)=>{
    const off=i.wahls_ok===false, cups=(+i.cups||0)&&GRP[i.group]?` · ${i.cups} cup ${GRP[i.group]}`:"";

function wahlsTracker(w){
  if(!w) return "";
  const cups=w.cups||{}, tgt=w.cup_targets||{greens:3,sulfur:3,color:3}, tags=w.tags||{};
  const HUE={greens:"#3ecf7a",sulfur:"#c08bf7",color:"#ff9f43"};
  // one segmented bar per colour group: 3 cup cells, partially filled
  const seg=(key,emoji,lab)=>{
    const v=cups[key]||0, t=tgt[key]||3, done=v>=t, col=HUE[key];
    let cells="";
    for(let i=0;i<t;i++){
      const fill=Math.max(0,Math.min(1,v-i));
      const bg=fill>=1?col:fill>0?`linear-gradient(90deg,${col} ${Math.round(fill*100)}%,var(--card) 0)`:"var(--card)";
      cells+=`<i style="background:${bg}"></i>`;
    }
    return `<div class="wseg${done?' done':''}"><span class="wse">${emoji}</span>
      <span class="wsl">${lab}</span><span class="wsc">${cells}</span>
      <span class="wsn" style="color:${done?'var(--good)':'var(--mut)'}">${done?"✓":`${v}/${t}`}</span></div>`;
  };
  // today's four dailies: 3 cup groups + seaweed (ferment is shown below but not counted)
  const dailies=[
    {done:(cups.greens||0)>=(tgt.greens||3), todo:`${Math.max(0,(tgt.greens||3)-(cups.greens||0)).toFixed(1).replace(/\.0$/,"")} cup${(tgt.greens||3)-(cups.greens||0)>1?"s":""} greens`},
    {done:(cups.sulfur||0)>=(tgt.sulfur||3), todo:`${Math.max(0,(tgt.sulfur||3)-(cups.sulfur||0)).toFixed(1).replace(/\.0$/,"")} cup${(tgt.sulfur||3)-(cups.sulfur||0)>1?"s":""} sulfur veg`},
    {done:(cups.color||0)>=(tgt.color||3), todo:`${Math.max(0,(tgt.color||3)-(cups.color||0)).toFixed(1).replace(/\.0$/,"")} cup${(tgt.color||3)-(cups.color||0)>1?"s":""} coloured`},
    {done:!!tags.seaweed, todo:"some seaweed"},
  ];
  const doneN=dailies.filter(d=>d.done).length, allDone=doneN===dailies.length;
  const off=w.off_plan||0;
  const pill=allDone&&!off
    ? `<span class="wpill ok">✓ On track — all dailies done</span>`
    : off ? `<span class="wpill bad">${off} off-plan item${off>1?"s":""} · ${doneN}/4 dailies</span>`
    : `<span class="wpill">${doneN}/4 dailies done</span>`;
  const todo=allDone?"":`<div class="wtodo">Still needed today: ${dailies.filter(d=>!d.done).map(d=>d.todo).join(" · ")}</div>`;
  // weekly targets as dots
  const dots=(n,t)=>Array.from({length:t},(_,i)=>`<i class="wdot${i<n?' on':''}"></i>`).join("");
  const weekly=`<div class="wweek">
    <span>This week</span>
    <span class="wwk">🐟 Omega-3 ${dots(Math.min(w.omega3_week||0,3),3)} <small>${w.omega3_week||0}/3</small></span>
    <span class="wwk">🥒 Ferment today ${tags.fermented?"✓":"–"} <small>optional</small></span>
    <span class="wwk">💊 Organ <small>daily tablets</small></span></div>`;
  return `<div class="wahls"><div class="wh">Wahls tracker ${pill}</div>
    ${seg("greens","🥬","Greens")}${seg("sulfur","🧄","Sulfur")}${seg("color","🌈","Colour")}
    ${todo}${weekly}
    <details class="winfo"><summary>What is Wahls Paleo?</summary>
      <p>Dr Terry Wahls' anti-inflammatory protocol, built for mitochondrial and autoimmune health.
      Each day: <b>9 cups of veg &amp; fruit</b> — 3 leafy greens, 3 sulfur-rich (broccoli, cabbage,
      onion, mushrooms), 3 deeply coloured (berries, beetroot, carrot, capsicum) — plus some
      <b>seaweed</b> (a fermented food is a bonus, not a target). Each week: <b>oily fish or
      mussels 2–3×</b>. Organ nutrition comes from daily tablets (no liver while free copper runs
      high — favour green-lipped mussels). No gluten, dairy, eggs, legumes, added sugar or
      packaged foods (even GF/DF); grains minimal. Protein target still rules:
      meat and fish stay front and centre.</p></details></div>`;
}
function fmtDate(iso){return new Date(iso+"T00:00").toLocaleDateString("en-NZ",{day:"numeric",month:"short",year:"numeric"});}
// Same visual language as the Trends charts (rgLineChart): thin raw line, bold 7-day moving
// average, dashed reference lines, small axis text — plus a dashed least-squares trend fitted
// to the charted readings and a dashed goal line.
function weightChart(hist,cur,goal,proj){
  const raw=(hist||[]).filter(d=>typeof d.v==="number").sort((a,b)=>a.t<b.t?-1:1);
  if(raw.length<2) return `<div class="rg-nochart">log weight regularly to see the trend</div>`;
  const color="#f0b35e";
  const ma=rgMovingAvg(raw,7);
  // least-squares trend over the charted window, in kg/day of real (calendar) time
  const xs=raw.map(d=>new Date(d.t+"T00:00").getTime()/86400000), ys=raw.map(d=>d.v);
  const mX=xs.reduce((a,b)=>a+b,0)/xs.length, mY=ys.reduce((a,b)=>a+b,0)/ys.length;
  const den=xs.reduce((s,x)=>s+(x-mX)**2,0);
  const slope=den?xs.reduce((s,x,i)=>s+(x-mX)*(ys[i]-mY),0)/den:0;
  const trend={start:mY+slope*(xs[0]-mX), end:mY+slope*(xs[xs.length-1]-mX)};
  const allV=[...ys,...ma.map(d=>d.v),goal,trend.start,trend.end];
  let mn=Math.min(...allV),mx=Math.max(...allV);
  const p=(mx-mn)*0.1||1; mn-=p; mx+=p;
  const W=640,H=190,padL=44,padR=10,padT=10,padB=20,iw=W-padL-padR,ih=H-padT-padB,n=raw.length;
  const X=i=>padL+(n===1?iw/2:iw*i/(n-1)), Y=v=>padT+ih*(1-(v-mn)/(mx-mn));
  const rawPts=raw.map((d,i)=>`${X(i).toFixed(1)},${Y(d.v).toFixed(1)}`).join(" ");
  const maPts=ma.map((d,i)=>`${X(i).toFixed(1)},${Y(d.v).toFixed(1)}`).join(" ");
  const gy=Y(goal);
  const legend=`<div class="rg-legend">
    <span><i class="rg-sw" style="background:${color}"></i>weight (7-day MA)</span>
    <span><i class="rg-sw" style="background:${color};opacity:.45"></i>raw</span>
    <span><i class="rg-sw dash" style="border-color:${color};color:${color}"></i>trend ${slope>0?"+":""}${fmt(slope*7,2)} kg/wk</span>
    <span><i class="rg-sw dash" style="border-color:var(--good);color:var(--good)"></i>goal ${goal} kg</span>
  </div>`;
  return legend+`<svg class="rg-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${rgAxes(mn,mx,padL,padT,iw,ih,v=>fmt(v,1))}
    <line x1="${padL}" x2="${padL+iw}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--good)" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.75"/>
    <polyline points="${rawPts}" fill="none" stroke="${color}" stroke-width="1" opacity="0.4"/>
    <polyline points="${maPts}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="${X(0).toFixed(1)}" y1="${Y(trend.start).toFixed(1)}" x2="${X(n-1).toFixed(1)}" y2="${Y(trend.end).toFixed(1)}" stroke="${color}" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.75"/>
    <circle cx="${X(n-1).toFixed(1)}" cy="${Y(raw[n-1].v).toFixed(1)}" r="2.6" fill="${color}"/>
    <text x="${padL}" y="${H-4}" font-size="9" fill="var(--dim)">${raw[0].t}</text>
    <text x="${padL+iw}" y="${H-4}" text-anchor="end" font-size="9" fill="var(--dim)">${raw[n-1].t}</text>
  </svg>`;
}

      <button class="t-link" onclick="expPost('/experiments/end',{})">End now</button></div>`

function reviewHeadline(r){

  const worst=r.habits.find(h=>h.slipping)||short[0];

}

function devBar(z,dir){

function renderInsights(){
  if(!INS){return;}
  const p=INS.patterns||{};

  const favCol=(r,gd)=>{const f=gd?r*gd:r; return f>0.04?"var(--good)":f<-0.04?"var(--bad)":"var(--mut)";};
  const corRow=c=>{
    const w=Math.min(Math.abs(c.r),1)*100, col=favCol(c.r,c.good_dir);
    const sig=c.sig
      ? `<span class="sigtag ok" title="p=${c.p}">significant</span>`

        <b class="cr" style="color:${col}">${c.r>0?"+":""}${c.r}</b></div></div>`;

function renderFoodSleep(){
  const fs=INS&&INS.food_sleep; if(!fs) return "";
  const clock=h=>{const m=Math.round(((h+12)%24)*60);return `${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;};
  const ln=fs.last_night;
  const last=ln?`<div class="muted" style="font-size:12px;margin:2px 2px 8px">Last night: heart rate bottomed out at <b style="color:var(--ink)">${clock(ln.hr_low_hour)}</b>`
    +(ln.hr_low_after_bed!=null?` (${ln.hr_low_after_bed.toFixed(1)} h after bed)`:"")
    +(ln.hrv_late_vs_early!=null?` · HRV ${ln.hrv_late_vs_early>=0?"rose":"fell"} ${Math.abs(ln.hrv_late_vs_early)} ms in the 2nd half`:"")
    +(ln.sleep_latency!=null?` · asleep in ${Math.round(ln.sleep_latency)} min`:"")+`</div>`:"";
  const fmt=o=>{
    const a=Math.abs(o.diff), worse=o.effect<0, col=(Math.abs(o.effect)<0.5||Math.min(o.n_yes,o.n_no)<5)?"var(--mut)":worse?"var(--warn)":"var(--good)";
    let t;

    else if(o.key==="deep") t=`deep sleep ${o.diff>0?"+":"−"}${Math.round(a*60)} min`;
    else{const L={sleep_score:"sleep score",hrv:"HRV",resting_hr:"lowest HR",hrv_late_vs_early:"HRV recovery"}[o.key]||o.label;
      t=`${L} ${o.diff>0?"+":"−"}${a<10?a.toFixed(1).replace(/\.0$/,""):Math.round(a)}${o.unit&&o.unit!=="h after bed"?" "+o.unit:""}`;}
    return `<span class="ckchip" style="color:${col}">${t}</span>`;

  }).join("");

  return `<div class="section-h" style="margin:4px 2px 2px">Food &amp; drink → that night</div>${last}
    ${rows||`<div class="muted" style="font-size:12px;margin:0 2px">Nothing to compare yet — keep logging food and drinks.</div>`}${need}
    <div class="muted" style="font-size:11px;margin:4px 2px 12px">Each evening vs the next night's Oura numbers, last ${fs.window_days} days. Green = better, amber = worse than nights without it; grey = small, or too few nights to tell.</div>`;

const WEEKDAY_ORDER=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function weekdayBars(wh){
  const entries=WEEKDAY_ORDER.map(d=>({label:d,v:(wh&&typeof wh[d]==="number")?wh[d]:null}));
  const vals=entries.map(e=>e.v).filter(v=>v!=null);

function driftRow(drift){

function histBars(values,{bins=10,unit="",dec=0}={}){
  values=(values||[]).filter(v=>typeof v==="number");

  const w=(mx-mn)/bins, counts=new Array(bins).fill(0);

  const bars=counts.map((c,i)=>{
    const pct=mxCount?10+90*c/mxCount:2;
    return `<div class="hb"><i style="height:${pct.toFixed(0)}%" title="${fmt(mn+i*w,dec)}–${fmt(mn+(i+1)*w,dec)}${unit}: ${c}d"></i></div>`;

// ---- "Charts" tab: aleksagordic.com/health-style dark terminal reports ----------------------
// Each metric is a raw (thin) + 7-day moving-average (bold) line, with a dashed average
// reference line and a swatch legend above the chart, matching that page's visual language.
function rgMovingAvg(data,days){
  const sorted=[...data].sort((a,b)=>a.t<b.t?-1:1);
  return sorted.map((d,i)=>{
    const win=sorted.slice(Math.max(0,i-days+1),i+1).map(x=>x.v);
    return {t:d.t,v:win.reduce((s,v)=>s+v,0)/win.length};
  });
}
function hourFromNoonToClock(v){
  if(v==null||isNaN(v)) return "–";
  const total=((v+12)%24+24)%24;
  let h=Math.floor(total),m=Math.round((total-h)*60);
  if(m===60){m=0;h=(h+1)%24;}
  const ap=h<12?"AM":"PM"; let h12=h%12; if(h12===0)h12=12;
  return `${h12}:${String(m).padStart(2,"0")} ${ap}`;
}
function rgAxes(mn,mx,padL,padT,iw,ih,yFmt,ticks=4,invert=false){
  const yLabels=[],gridLines=[];
  for(let i=0;i<=ticks;i++){
    const v=invert?mx-(mx-mn)*i/ticks:mn+(mx-mn)*i/ticks, y=padT+ih*(1-i/ticks);
    yLabels.push(`<text x="${(padL-6).toFixed(1)}" y="${y.toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="9" fill="var(--dim)">${yFmt(v)}</text>`);
    gridLines.push(`<line x1="${padL}" x2="${padL+iw}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`);
  }
  return gridLines.join("")+yLabels.join("");
}
function rgLineChart(raw,{h=170,color="#3ef07a",unit="",dec=0,maDays=7,yFmt=null,label=""}={}){
  raw=(raw||[]).filter(d=>typeof d.v==="number").sort((a,b)=>a.t<b.t?-1:1);
  if(raw.length<2) return {svg:`<div class="rg-nochart">not enough data yet</div>`,legend:""};
  const ma=rgMovingAvg(raw,maDays);
  const allV=[...raw.map(d=>d.v),...ma.map(d=>d.v)];
  let mn=Math.min(...allV),mx=Math.max(...allV);
  const pad=(mx-mn)*0.1||1; mn-=pad; mx+=pad;
  const avg=raw.reduce((s,d)=>s+d.v,0)/raw.length;
  const W=640,H=h,padL=44,padR=10,padT=10,padB=20,iw=W-padL-padR,ih=H-padT-padB,n=raw.length;
  const X=i=>padL+(n===1?iw/2:iw*i/(n-1)), Y=v=>padT+ih*(1-(v-mn)/(mx-mn));
  const fmtY=v=>yFmt?yFmt(v):fmt(v,dec)+(unit?" "+unit:"");
  const rawPts=raw.map((d,i)=>`${X(i).toFixed(1)},${Y(d.v).toFixed(1)}`).join(" ");
  const maPts=ma.map((d,i)=>`${X(i).toFixed(1)},${Y(d.v).toFixed(1)}`).join(" ");
  const avgY=Y(avg);
  const svg=`<svg class="rg-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${rgAxes(mn,mx,padL,padT,iw,ih,fmtY)}
    <polyline points="${rawPts}" fill="none" stroke="${color}" stroke-width="1" opacity="0.4"/>
    <polyline points="${maPts}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="${padL}" x2="${padL+iw}" y1="${avgY.toFixed(1)}" y2="${avgY.toFixed(1)}" stroke="${color}" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.75"/>
    <text x="${padL}" y="${H-4}" font-size="9" fill="var(--dim)">${raw[0].t}</text>
    <text x="${padL+iw}" y="${H-4}" text-anchor="end" font-size="9" fill="var(--dim)">${raw[n-1].t}</text>
  </svg>`;
  const legend=`<div class="rg-legend">
    <span><i class="rg-sw" style="background:${color}"></i>${label} (7-day MA)</span>
    <span><i class="rg-sw" style="background:${color};opacity:.45"></i>${label} (raw)</span>
    <span><i class="rg-sw dash" style="border-color:${color};color:${color}"></i>avg: ${fmtY(avg)}</span>
  </div>`;
  return {svg,legend};
}
function rgDualLineChart(seriesA,seriesB,{h=190,colorA,colorB,labelA,labelB,maDays=7,yFmt=null,invertY=false}={}){
  seriesA=(seriesA||[]).filter(d=>typeof d.v==="number").sort((a,b)=>a.t<b.t?-1:1);
  seriesB=(seriesB||[]).filter(d=>typeof d.v==="number").sort((a,b)=>a.t<b.t?-1:1);
  if(seriesA.length<2&&seriesB.length<2) return {svg:`<div class="rg-nochart">not enough data yet</div>`,legend:""};
  const maA=rgMovingAvg(seriesA,maDays), maB=rgMovingAvg(seriesB,maDays);
  const allT=[...new Set([...seriesA,...seriesB].map(d=>d.t))].sort();
  const allV=[...seriesA,...seriesB,...maA,...maB].map(d=>d.v);
  let mn=Math.min(...allV),mx=Math.max(...allV);
  const pad=(mx-mn)*0.1||1; mn-=pad; mx+=pad;
  const avgA=seriesA.length?seriesA.reduce((s,d)=>s+d.v,0)/seriesA.length:null;
  const avgB=seriesB.length?seriesB.reduce((s,d)=>s+d.v,0)/seriesB.length:null;
  const W=640,H=h,padL=54,padR=10,padT=10,padB=20,iw=W-padL-padR,ih=H-padT-padB,n=allT.length;
  const tIndex=Object.fromEntries(allT.map((t,i)=>[t,i]));
  // invertY: smaller values at the top — for time-of-day axes, where earlier should read first
  const X=t=>padL+(n===1?iw/2:iw*tIndex[t]/(n-1)), Y=v=>padT+ih*(invertY?(v-mn)/(mx-mn):1-(v-mn)/(mx-mn));
  const fmtY=v=>yFmt?yFmt(v):fmt(v,1);
  const line=(arr,sw,op,color)=>`<polyline points="${arr.map(d=>`${X(d.t).toFixed(1)},${Y(d.v).toFixed(1)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="${sw}" opacity="${op}"/>`;
  const avgLine=(avg,color)=>avg==null?"":`<line x1="${padL}" x2="${padL+iw}" y1="${Y(avg).toFixed(1)}" y2="${Y(avg).toFixed(1)}" stroke="${color}" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.75"/>`;
  const svg=`<svg class="rg-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${rgAxes(mn,mx,padL,padT,iw,ih,fmtY,4,invertY)}
    ${line(seriesA,1,0.4,colorA)}${line(seriesB,1,0.4,colorB)}
    ${line(maA,2.2,1,colorA)}${line(maB,2.2,1,colorB)}
    ${avgLine(avgA,colorA)}${avgLine(avgB,colorB)}
    <text x="${padL}" y="${H-4}" font-size="9" fill="var(--dim)">${allT[0]}</text>
    <text x="${padL+iw}" y="${H-4}" text-anchor="end" font-size="9" fill="var(--dim)">${allT[n-1]}</text>
  </svg>`;
  const legend=`<div class="rg-legend">
    <span><i class="rg-sw" style="background:${colorA}"></i>${labelA} (7-day MA)</span>
    <span><i class="rg-sw" style="background:${colorB}"></i>${labelB} (7-day MA)</span>
    ${avgA!=null?`<span><i class="rg-sw dash" style="border-color:${colorA};color:${colorA}"></i>avg ${labelA.toLowerCase()}: ${fmtY(avgA)}</span>`:""}
    ${avgB!=null?`<span><i class="rg-sw dash" style="border-color:${colorB};color:${colorB}"></i>avg ${labelB.toLowerCase()}: ${fmtY(avgB)}</span>`:""}
  </div>`;
  return {svg,legend};
}
function rgCard(title,sub,fn){
  let r; try{ r=fn(); }catch(e){ console.error(`[chart] ${title} failed:`,e); return `<div class="rg-card"><h3>${title}</h3><div class="rg-nochart">couldn't render — ${esc(e.message||e)}</div></div>`; }
  return `<div class="rg-card"><h3>${title}</h3>${sub?`<div class="rg-sub">${sub}</div>`:""}${r.legend}${r.svg}</div>`;
}

let WKLOG_T=null;
async function renderWorkoutLog(){
  const box=document.getElementById("wkLog"); if(!box) return;

  const prevDetails=box.querySelector("details.wklog");
  const wasOpen=prevDetails&&prevDetails.open;
  const prevVals={};
  if(prevDetails){
    prevDetails.querySelectorAll("input[data-mov][data-set]").forEach(inp=>{
      if(inp.value.trim()) prevVals[inp.dataset.mov+"_"+inp.dataset.set]=inp.value;
    });
  }
  let d; try{ d=await fetch(`${hubBase()}/workout/log`).then(r=>r.json()); }catch(e){ return; }
  if(!d||!d.movements||!d.movements.length){ box.innerHTML=""; return; }   // rest / endurance day
  const n=d.set_count||3;
  const setInputs=(mv)=>Array.from({length:n},(_,i)=>{
    const key=mv.name+"_"+i;
    const val=prevVals[key]||(mv.sets&&mv.sets[i]?mv.sets[i]:"");
    return `<div class="wklog-set" style="flex:1 1 52px;max-width:80px"><b>SET ${i+1}</b>`+
      `<input inputmode="decimal" enterkeyhint="next" class="${val?'filled':''}" `+
      `data-mov="${esc(mv.name)}" data-set="${i}" value="${esc(val)}" placeholder="kg"></div>`;
  }).join("");
  const logged=d.movements.reduce((a,mv)=>a+((mv.sets||[]).filter(Boolean).length),0);
  box.innerHTML=`
    <details class="wklog"${wasOpen?" open":""}>
      <summary class="wklog-h" style="cursor:pointer;list-style:none;-webkit-user-select:none;user-select:none">
        <span>🏋️ Log weights</span><small>${logged?`✓ ${logged} logged · `:""}${n} sets · kg · tap to open</small>
      </summary>
      ${d.movements.map(mv=>`
        <div class="wklog-mov">
          <div class="wklog-name">${esc(mv.name)}${mv.prescribed?`<small>prescribed ${esc(mv.prescribed)}</small>`:``}</div>
          <div class="wklog-sets">${setInputs(mv)}</div>
        </div>`).join("")}
      <div class="wklog-foot">
        <label>RPE (1-10)<input id="wklogRpe" inputmode="decimal" value="${esc(d.rpe||'')}" placeholder="e.g. 8"></label>
        <label>Notes<input id="wklogNotes" value="${esc(d.notes||'')}" placeholder="how it felt"></label>

  });
}
async function saveWorkoutLog(){
