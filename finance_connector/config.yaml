name: Finance Connector
slug: finance_connector
version: "1.0.0"
description: Lets Claude use the Finance app from the cloud, behind your Home Assistant login (MCP)
url: https://github.com/markreesnz/health-hub
arch:
  - aarch64
  - amd64
init: false
boot: auto
startup: application
# No ports are published. Home Assistant reaches this add-on on the Supervisor's
# private network through the bundled finance_mcp integration.
map:
  - type: homeassistant_config
    read_only: false
  - type: share
    read_only: false
options:
  finance_url: "http://44616b96-financial-planner:8765"
schema:
  finance_url: url
